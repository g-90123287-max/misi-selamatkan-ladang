<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d3028"><title>Escape Room — Misi Selamatkan Ladang</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#ecfff4;background:#071c19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#215746,#071c19 65%);min-height:100vh}.wrap{max-width:780px;margin:auto;padding:22px 16px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:850;letter-spacing:.03em;color:#b8ffba;font-size:13px}.pill{border:1px solid #467e68;border-radius:999px;padding:7px 11px;color:#d4f8e2;font-size:12px}.hero{padding:28px 20px;border:1px solid #3a7562;background:linear-gradient(145deg,#174d3d,#0b2c28);border-radius:24px;box-shadow:0 18px 55px #0005}.eyebrow{color:#a5ffb2;font-size:12px;letter-spacing:.18em;font-weight:800;text-transform:uppercase}h1{font-size:clamp(30px,7vw,50px);line-height:1.07;margin:12px 0}p{line-height:1.6;color:#c4e4d6}.hero-art{font-size:50px;margin:12px 0}.btn{cursor:pointer;border:0;border-radius:13px;background:#c5ff8a;color:#103424;font-weight:800;padding:15px 19px;font-size:15px;min-height:50px}.btn:disabled{opacity:.45;cursor:default}.btn.alt{background:#244e43;color:#f0fff7;border:1px solid #508f77}.btn.full{width:100%}.btnrow{display:flex;gap:9px;flex-wrap:wrap}.card{background:#12352f;border:1px solid #3b7162;border-radius:20px;padding:21px;margin-top:16px}.muted{color:#afd0c0}.stagegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.stage{border:1px solid #417c68;background:#14392f;border-radius:18px;padding:15px;min-height:125px}.stage.locked{opacity:.45}.stage .em{font-size:31px}.stage strong{display:block;margin:8px 0 4px}.stage small{color:#b9d5c7}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1a4437;border-radius:13px;padding:11px;text-align:center}.stat strong{display:block;font-size:21px;color:#d2ff9e}.stat span{font-size:11px;color:#c4ddcf}.bar{height:9px;background:#335a4b;border-radius:20px;overflow:hidden;margin:12px 0 16px}.bar>div{height:100%;background:#b7f77d;transition:width .3s}.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px;margin:10px 0;border:1px solid #487565;border-radius:13px;background:#1a4035;color:#f0fff5;font-size:15px;cursor:pointer}.opt span{background:#315e4e;padding:4px 9px;border-radius:8px;font-weight:800}.opt.sel{border:2px solid #c7ff8e;background:#2b5a43}.opt:disabled{cursor:default;opacity:.8}.feedback{border-radius:14px;background:#254d3b;padding:16px;margin:14px 0;border-left:5px solid #b9ff83}.feedback.bad{border-left-color:#ffbc77}.feedback p{margin:7px 0}.kicker{font-size:12px;color:#b8e9c5;text-transform:uppercase;letter-spacing:.1em}.finish{text-align:center}.finish .big{font-size:62px}.note{font-size:12px;color:#9cc2b0;margin-top:22px}.hidden{display:none!important}input{background:#f3fff5;border:0;border-radius:12px;padding:14px;font-size:16px;width:100%;margin:10px 0;color:#14352a}@media(max-width:390px){.stagegrid{grid-template-columns:1fr}.hero{padding:22px 17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap"><header><div class="brand">🌿 AKADEMI LADANG • KSSM T4</div><div class="pill" id="headstat">30 CABARAN</div></header><main id="app"></main><div class="note">Latihan adaptasi daripada bank soalan MPPM Kedah T4 2026. Permainan ini berjalan pada peranti murid; keputusan tidak dihantar kepada guru secara automatik. Tiada akaun diperlukan.</div></div><script>
const DATA={"stages": [{"title": "Makmal Tanah", "emoji": "🌱", "desc": "Pulihkan kesuburan tanah dan sistem saliran.", "count": 8}, {"title": "Stor Baja", "emoji": "🧪", "desc": "Pilih nutrien dan selesaikan pengiraan pembajaan.", "count": 9}, {"title": "Reban Poltri", "emoji": "🐔", "desc": "Selamatkan ternakan dengan pengurusan yang tepat.", "count": 8}, {"title": "Pejabat Ladang", "emoji": "💰", "desc": "Selesaikan rekod kos dan prestasi ternakan.", "count": 5}], "questions": [{"stage": 0, "source": 1, "q": "Tanah yang mempunyai rongga udara sangat kecil dan daya memegang air tinggi ialah...", "options": ["Tanah pasir", "Tanah liat", "Tanah berkerikil", "Tanah berbatu"], "answer": 1, "why": "Tanah liat mempunyai zarah halus dan rongga udara kecil, maka air mudah ditahan."}, {"stage": 0, "source": 4, "q": "Bagaimanakah saiz rongga udara tanah pasir?", "options": ["Sangat kecil", "Sangat besar", "Tiada rongga", "Sama dengan tanah liat"], "answer": 1, "why": "Jadual 1 menyatakan tanah pasir mempunyai rongga udara sangat besar."}, {"stage": 0, "source": 6, "q": "Mengapakah tanah liat lebih mudah menakung air berbanding tanah pasir?", "options": ["Rongga tanah liat lebih kecil", "Rongga tanah liat lebih besar", "Tanah liat tiada mineral", "Tanah pasir tidak mempunyai udara"], "answer": 0, "why": "Zarah dan rongga kecil tanah liat memperlahankan pergerakan air."}, {"stage": 0, "source": 8, "q": "Struktur tanah yang tersusun seperti kepingan mendatar dikenali sebagai...", "options": ["Berbutir", "Berlapis", "Berblok", "Prismatik"], "answer": 1, "why": "Rajah 2 menunjukkan struktur berlapis yang kelihatan seperti kepingan."}, {"stage": 0, "source": 11, "q": "Alat elektronik yang digunakan untuk mengukur pH tanah ialah...", "options": ["Anemometer", "Meter pH", "Higrometer", "Lux meter"], "answer": 1, "why": "Skema soalan 4(i): kaedah meter pH; kaedah Kuhn ialah kaedah kedua."}, {"stage": 0, "source": 13, "q": "Bacaan pH tanah 7 menunjukkan tanah bersifat...", "options": ["Sangat berasid", "Neutral", "Sangat beralkali", "Bergaram tinggi"], "answer": 1, "why": "Pada skala pH, nilai 7 ialah neutral."}, {"stage": 0, "source": 16, "q": "Dalam eksperimen mendapan tanah, lapisan yang paling bawah lazimnya terdiri daripada...", "options": ["Liat", "Kelodak", "Pasir", "Humus terapung"], "answer": 2, "why": "Zarah pasir lebih besar dan lazimnya mendap terlebih dahulu di bahagian bawah."}, {"stage": 0, "source": 17, "q": "Apakah susunan lapisan mineral dari bawah ke atas selepas mendapan tanah?", "options": ["Liat–kelodak–pasir", "Pasir–kelodak–liat", "Kelodak–pasir–liat", "Pasir–liat–kelodak"], "answer": 1, "why": "Pasir mendap dahulu, diikuti kelodak dan akhirnya liat yang lebih halus."}, {"stage": 1, "source": 21, "q": "Baja yang membekalkan satu unsur nutrien utama sahaja dikenali sebagai...", "options": ["Baja campuran", "Baja tunggal", "Baja organik", "Baja sebatian"], "answer": 1, "why": "Baja tunggal membekalkan satu unsur nutrien utama, contohnya urea membekalkan nitrogen."}, {"stage": 1, "source": 22, "q": "Apakah maksud baja campuran?", "options": ["Baja tanpa nutrien", "Campuran dua atau lebih baja bagi membekalkan nutrien", "Baja yang hanya mengandungi air", "Baja yang semestinya daripada tinja"], "answer": 1, "why": "Skema soalan 6(ii): baja tunggal yang dicampur secara fizikal."}, {"stage": 1, "source": 23, "q": "Baja CIRP yang mengandungi fosfat digunakan untuk membantu...", "options": ["Pembentukan akar dan perkembangan bunga", "Menghalang semua penyakit", "Menurunkan suhu reban", "Membunuh rumpai"], "answer": 0, "why": "CIRP ialah baja fosfat; fosforus penting untuk pertumbuhan akar dan perkembangan pembiakan tanaman."}, {"stage": 1, "source": 25, "q": "Penggunaan baja kimia secara berlebihan boleh menyebabkan...", "options": ["Pertumbuhan akar sentiasa meningkat", "Kecederaan atau lecur pada tanaman", "Tanah sentiasa neutral", "Tiada kesan sampingan"], "answer": 1, "why": "Kepekatan garam baja yang tinggi boleh mencederakan akar dan daun."}, {"stage": 1, "source": 28, "q": "Mengapakah kadar pembebasan nutrien baja organik biasanya lebih perlahan?", "options": ["Perlu melalui proses penguraian", "Tidak mengandungi bahan organik", "Semua nutrien berbentuk gas", "Tidak dapat digunakan tumbuhan"], "answer": 0, "why": "Mikroorganisma perlu menguraikan bahan organik untuk membebaskan nutrien."}, {"stage": 1, "source": 29, "q": "Berapakah keperluan CIRP untuk 2 hektar jika kadarnya 200 kg sehektar?", "options": ["100 kg", "200 kg", "400 kg", "800 kg"], "answer": 2, "why": "Skema soalan 9: 200 kg/hektar × 2 hektar = 400 kg CIRP."}, {"stage": 1, "source": 30, "q": "Jika satu beg CIRP seberat 50 kg, berapa beg diperlukan bagi 400 kg baja?", "options": ["4", "6", "8", "10"], "answer": 2, "why": "400 ÷ 50 = 8 beg."}, {"stage": 1, "source": 31, "q": "Dalam Rajah 6, CIRP berharga RM90 bagi satu beg 50 kg. Berapakah kos 8 beg baja?", "options": ["RM720", "RM760", "RM800", "RM680"], "answer": 0, "why": "400 kg memerlukan 8 beg (50 kg setiap beg); 8 × RM90 = RM720."}, {"stage": 1, "source": 36, "q": "Tanaman memerlukan 80 kg N. Berapakah anggaran urea 46% N diperlukan?", "options": ["36.8 kg", "80.0 kg", "173.9 kg", "260.9 kg"], "answer": 2, "why": "80 kg nitrogen ÷ 0.46 = 173.91 kg baja urea (anggaran 173.9 kg)."}, {"stage": 2, "source": 41, "q": "Penternakan poltri dalam bangunan terkawal dengan pengurusan rapi dikenali sebagai sistem...", "options": ["Integrasi", "Intensif", "Lepas bebas", "Tradisional sepenuhnya"], "answer": 1, "why": "Sistem intensif menempatkan ternakan dalam persekitaran yang lebih terkawal."}, {"stage": 2, "source": 42, "q": "Sistem yang menggabungkan ternakan dengan aktiviti pertanian lain dikenali sebagai...", "options": ["Integrasi", "Intensif", "Monokultur", "Hidroponik"], "answer": 0, "why": "Integrasi menggabungkan komponen ternakan dengan kegiatan pertanian lain."}, {"stage": 2, "source": 43, "q": "Sistem separa intensif lazimnya menggabungkan...", "options": ["Kurungan dan kawasan pergerakan terhad", "Ternakan tanpa sebarang kawalan", "Hanya sangkar automatik", "Hanya ternakan dalam kolam"], "answer": 0, "why": "Separa intensif menggabungkan ruang kurungan dengan kawasan pergerakan yang dikawal."}, {"stage": 2, "source": 45, "q": "Antara berikut, yang manakah faktor pemilihan sistem penternakan?", "options": ["Bilangan ternakan dan kos", "Warna kasut pekerja", "Jenama telefon penternak", "Bilangan poster di reban"], "answer": 0, "why": "Rajah 8 menyenaraikan bilangan ternakan dan kos sebagai faktor pemilihan."}, {"stage": 2, "source": 46, "q": "Apakah fungsi anemometer dalam persekitaran reban?", "options": ["Mengukur kelajuan udara", "Mengukur berat ayam", "Mengira bilangan telur", "Mengukur pH makanan"], "answer": 0, "why": "Skema soalan 14(i): alat menentukan pergerakan dan kelajuan angin di dalam reban."}, {"stage": 2, "source": 47, "q": "Mengapakah pengukuran aliran udara penting dalam reban?", "options": ["Membantu menilai pengudaraan", "Menentukan warna bulu", "Menggantikan air minuman", "Menimbang makanan"], "answer": 0, "why": "Aliran udara berkaitan dengan pengudaraan dan keselesaan ternakan."}, {"stage": 2, "source": 49, "q": "Apakah kesan pengudaraan reban yang lemah?", "options": ["Pengumpulan haba dan gas tidak menyenangkan", "Ayam terus kebal penyakit", "Makanan bertambah secara automatik", "Keperluan air menjadi sifar"], "answer": 0, "why": "Pengudaraan lemah boleh meningkatkan haba, kelembapan dan pengumpulan gas."}, {"stage": 2, "source": 54, "q": "Sebelum anak ayam dimasukkan, apakah peralatan yang perlu disediakan?", "options": ["Bekas makanan, minuman dan pemanas", "Mesin rumput sahaja", "Penyembur cat", "Penimbang hasil tuaian"], "answer": 0, "why": "Rajah langkah penyediaan perumahan menekankan bekas makanan, minuman dan pemanas."}, {"stage": 3, "source": 10, "q": "Bagi 2,000 ayam pedaging dengan berat jualan 1.87 kg/ekor pada RM5.20/kg, berapakah anggaran pendapatan?", "options": ["RM19,448", "RM18,700", "RM14,487", "RM20,000"], "answer": 0, "why": "2000 × 1.87 kg × RM5.20 = RM19,448. Data ini diambil daripada Jadual 7."}, {"stage": 3, "source": 24, "q": "Jumlah kos berubah ialah RM12,200 dan kos tetap RM920. Berapakah jumlah kos sebelum kos luar jangka?", "options": ["RM12,920", "RM13,120", "RM13,170", "RM14,432"], "answer": 1, "why": "Jumlah kos sebelum kos luar jangka = RM12,200 + RM920 = RM13,120."}, {"stage": 3, "source": 37, "q": "Tanaman memerlukan 90 kg K₂O. Berapakah MOP 60% K₂O diperlukan?", "options": ["54 kg", "90 kg", "150 kg", "240 kg"], "answer": 2, "why": "90 kg K₂O ÷ 0.60 = 150 kg baja MOP."}, {"stage": 3, "source": 59, "q": "Berdasarkan Jadual 7(a), berat ayam minggu ketiga 710 g dan minggu keempat 1100 g. Jika makanan dimakan minggu keempat ialah 703 g, berapakah NPM minggu keempat?", "options": ["0.55", "1.80", "2.82", "3.90"], "answer": 1, "why": "NPM = jumlah makanan dimakan ÷ pertambahan berat. 703 g ÷ (1,100 g − 710 g) = 703 ÷ 390 ≈ 1.80."}, {"stage": 3, "source": 60, "q": "Berdasarkan Jadual 7(b), berapakah jumlah kos berubah termasuk bil air RM350?", "options": ["RM12,150", "RM12,200", "RM12,250", "RM12,300"], "answer": 1, "why": "Jumlah kos berubah menggunakan bil air RM350 dalam soalan asal ialah RM12,200."}]};let state={name:'',i:0,score:0,chosen:null,submitted:false,results:[],started:false};const app=document.getElementById('app');const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const totals=DATA.stages.map(s=>s.count);const offsets=[0];for(let j=0;j<totals.length;j++)offsets.push(offsets.at(-1)+totals[j]);function stageOf(i){return DATA.questions[Math.min(i,29)].stage}function save(){try{localStorage.setItem('ladang_escape_v1',JSON.stringify(state))}catch(e){}}function load(){try{const v=JSON.parse(localStorage.getItem('ladang_escape_v1'));if(v&&v.started&&Array.isArray(v.results)&&v.i>=0&&v.i<=30)state=v}catch(e){}}function summary(){return `<div class="statrow"><div class="stat"><strong>${state.score}</strong><span>MARKAH / 300</span></div><div class="stat"><strong>${state.results.length}/30</strong><span>SELESAI</span></div><div class="stat"><strong>${Math.floor(state.results.length/30*100)}%</strong><span>KEMAJUAN</span></div></div>`}function intro(){app.innerHTML=`<section class="hero"><div class="eyebrow">ESCAPE ROOM • MISI KHAS</div><div class="hero-art">🏚️🌱🔐🐔</div><h1>Misi Selamatkan Ladang</h1><p>Bekalan baja hilang, reban bermasalah dan rekod ladang terkunci! Selesaikan <b>30 cabaran</b> untuk membuka empat bilik rahsia dan menyelamatkan ladang.</p><div class="statrow"><div class="stat"><strong>4</strong><span>BILIK</span></div><div class="stat"><strong>30</strong><span>CABARAN</span></div><div class="stat"><strong>300</strong><span>MARKAH MAKS.</span></div></div><label for="student">Nama pemain (pilihan)</label><input id="student" maxlength="40" placeholder="Contoh: Aina 4 Bestari"><button class="btn full" id="start">Mulakan misi →</button></section><div class="stagegrid">${DATA.stages.map((s,j)=>`<div class="stage ${j?'locked':''}"><div class="em">${s.emoji}</div><strong>${j+1}. ${esc(s.title)}</strong><small>${s.count} cabaran • ${j?'🔒 Terkunci':'🔓 Sedia'}</small></div>`).join('')}</div>`;$('start').onclick=()=>{state={name:$('student').value.trim(),i:0,score:0,chosen:null,submitted:false,results:[],started:true};save();render()}}function play(){let q=DATA.questions[state.i],s=DATA.stages[q.stage],n=state.i-offsets[q.stage]+1;app.innerHTML=`<div class="card"><div class="kicker">Bilik ${q.stage+1} / 4 • ${esc(s.title)}</div><h2>${s.emoji} ${esc(s.desc)}</h2>${summary()}<div class="bar"><div style="width:${state.results.length/30*100}%"></div></div><div class="kicker">CABARAN ${state.i+1}/30 • ${n}/${s.count} DALAM BILIK INI</div><h2 style="line-height:1.4;font-size:clamp(19px,5vw,25px)">${esc(q.q)}</h2><div id="opts">${q.options.map((o,j)=>`<button class="opt ${state.chosen===j?'sel':''}" data-j="${j}" ${state.submitted?'disabled':''}><span>${'ABCD'[j]}</span><div>${esc(o)}</div></button>`).join('')}</div><div id="feedback">${state.submitted?feedbackHTML(q):''}</div><div class="btnrow"><button class="btn full" id="action" ${state.chosen===null?'disabled':''}>${state.submitted?(state.i===29?'Lihat keputusan akhir →':offsets.includes(state.i+1)?'Buka bilik seterusnya 🔓':'Cabaran seterusnya →'):'Semak jawapan'}</button></div></div>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(state.submitted)return;state.chosen=Number(b.dataset.j);save();render()});$('action').onclick=()=>{if(!state.submitted){state.submitted=true;let correct=state.chosen===q.answer;state.results.push({source:q.source,correct,chosen:state.chosen});if(correct)state.score+=10;save();render()}else{state.i++;state.chosen=null;state.submitted=false;save();render()}}}function feedbackHTML(q){let good=state.chosen===q.answer;return `<div class="feedback ${good?'':'bad'}"><b>${good?'✅ Betul! +10 mata':'🔎 Belum tepat. +0 mata'}</b><p><b>Jawapan:</b> ${esc(q.options[q.answer])}</p><p><b>Penerangan:</b> ${esc(q.why)}</p></div>`}function end(){let wrong=state.results.filter(r=>!r.correct);app.innerHTML=`<section class="hero finish"><div class="big">${state.score>=240?'🏆':'🌾'}</div><div class="eyebrow">SEMUA PINTU DIBUKA!</div><h1>Ladang berjaya diselamatkan!</h1><p>${state.name?esc(state.name)+', ':''}anda telah menamatkan keempat-empat misi.</p>${summary()}<p><b>${state.results.filter(r=>r.correct).length} betul</b> daripada 30 soalan. ${state.score>=240?'Cemerlang!':state.score>=160?'Bagus! Teruskan ulang kaji.':'Terus berlatih untuk menguasai topik.'}</p><div class="btnrow"><button class="btn" id="copy">Salin keputusan</button><button class="btn alt" id="again">Main semula</button></div></section><div class="card"><h2>📋 Soalan yang perlu diulang kaji (${wrong.length})</h2>${wrong.length?wrong.map(r=>{let q=DATA.questions.find(x=>x.source===r.source);return `<p>• <b>${esc(q.q)}</b><br><span class="muted">${esc(q.options[q.answer])} — ${esc(q.why)}</span></p>`}).join(''):'<p>Hebat! Semua jawapan betul.</p>'}</div>`;$('copy').onclick=()=>{let t=`MISI SELAMATKAN LADANG\nNama: ${state.name||'Pemain'}\nMarkah: ${state.score}/300\nBetul: ${state.results.filter(r=>r.correct).length}/30`;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert('Keputusan disalin.')).catch(()=>prompt('Salin keputusan:',t));else prompt('Salin keputusan:',t)};$('again').onclick=()=>{if(confirm('Mulakan permainan baharu? Kemajuan lama akan dipadam.')){localStorage.removeItem('ladang_escape_v1');state.started=false;render()}}}function render(){document.getElementById('headstat').textContent=state.started?`${state.score} MATA • ${Math.min(state.i+1,30)}/30`:'30 CABARAN';if(!state.started)intro();else if(state.i>=30)end();else play()}load();render();
</script></body></html>
